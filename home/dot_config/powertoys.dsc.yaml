$schema: https://raw.githubusercontent.com/PowerShell/DSC/main/schemas/2023/08/config/document.json
metadata:
  winget:
    processor: dscv3
resources:
  - name: Install PowerToys
    type: Microsoft.WinGet/Package
    properties:
      id: Microsoft.PowerToys
      source: winget
      _exist: true

  # PowerToys Run has no settings resource, so its activation shortcut cannot be configured through DSC.
  - name: Configure PowerToys
    type: Microsoft.PowerToys/AppSettings
    properties:
      settings:
        properties:
          Enabled:
            Awake: false
            "PowerToys Run": true
        name: App
        version: 1.0
